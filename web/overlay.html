<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111c2b">
<meta name="description" content="边狱公司15层镜牢：Game Bar超小悬浮攻略，图片、卡包、商店、合成与制约">
<link rel="icon" href="./overlay-icon-192.png">
<link rel="apple-touch-icon" href="./overlay-icon-192.png">
<link rel="manifest" href="./overlay-manifest.json">
<link rel="stylesheet" href="./overlay.css">
<title>镜牢指挥条 · 游戏悬浮 App</title>
</head>
<body>
<div id="app">
  <header class="toolbar">
    <span class="mark" aria-label="镜牢指挥条">◈</span>
    <select id="team" title="选择队伍" aria-label="选择队伍"><option value="burnVideo">拇指×黎明·烧震</option><option value="wedgeVideo">楔子×黎明·呼震</option></select>
    <button type="button" id="prev" title="上一层" aria-label="上一层">‹</button>
    <select id="floor" aria-label="选择楼层" title="跳转楼层"></select>
    <button type="button" id="next" title="下一层" aria-label="下一层">›</button>
    <button type="button" id="settings" aria-label="显示更多功能" title="更多">⋯</button>
  </header>
  <div id="summary" class="summary">
    <img id="heroImg" src="./overlay-icon-192.png" alt="当前目标的图片" width="43" height="43">
    <div class="summaryText"><span id="smallLabel" class="eyebrow">准备</span><b id="command">选择队伍，开始攻略</b><small id="subline">只显示目前要做的事</small></div>
    <button type="button" id="expand" aria-label="展开详细攻略" title="展开或收起">▾</button>
  </div>
  <nav id="phases" class="phases" aria-label="快速切换操作阶段">
    <button type="button" data-stage="packs" class="active">卡包</button>
    <button type="button" data-stage="map">地图</button>
    <button type="button" data-stage="gifts">饰品</button>
    <button type="button" data-stage="shop">商店</button>
    <button type="button" data-stage="trial">层末</button>
  </nav>
  <section id="sheet" class="sheet" hidden>
    <div class="sheetHead"><strong id="sheetTitle">当前操作</strong><button type="button" id="closeSheet" title="收起">收起 ⌃</button></div>
    <div id="sheetBody"></div>
  </section>
  <section id="extras" class="extras" hidden>
    <button type="button" id="openImages">🖼 图片管理</button>
    <button type="button" id="openRank">★ 饰品优先表</button>
    <button type="button" id="openRecipes">⚗ 固定合成</button>
    <button type="button" id="openBoss">☠ BOSS 攻略</button>
    <button type="button" id="openFull">完整攻略 ↗</button>
    <label class="settingsRow">窗口内背景浓度 <input id="opacity" type="range" min="65" max="100" value="94"></label>
    <div class="caption">真实置顶、透明度和鼠标穿透：使用上方原生控制条。网页背景浓度与窗口透明度分开。</div>
  </section>
  <section id="reference" class="reference" hidden>
    <div class="sheetHead"><button type="button" id="backRef">← 返回</button><b id="refTitle">饰品图鉴</b><button type="button" id="closeRef">×</button></div>
    <div id="refBody"></div>
  </section>
  <div class="foot">公开版内置原创卡片；支持用户自行导入本地截图 · 按卡包 → 地图 → 饰品 → 商店 → 层末查看 · 非实时游戏读取</div>
</div>
<script src="./overlay-store.js"></script>
<script src="./video-guides.js"></script>
<script src="./gift-audit.js"></script>
<script src="./overlay-knowledge.js"></script>
<script src="./overlay-bosses.js"></script>
<script src="./artwork-catalog.js"></script>
<script src="./visual-assets.js"></script>
<script src="./overlay.js"></script>
</body>
</html>
